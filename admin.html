<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Deepak Web Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f5f6fa;color:#16181d}.top{height:65px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:900}.brand span{color:#8b7cff}.wrap{max-width:1200px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat,.panel{background:white;border:1px solid #e7e8ee;border-radius:16px;padding:18px}.stat b{font-size:26px;display:block}.stat small{color:#697386}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:26px 0 13px;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#111827;color:white}.danger{background:#fff0f0;color:#c0392b}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800;color:#596174}input,textarea,select{width:100%;margin-top:6px;padding:12px;border:1px solid #dddfe7;border-radius:10px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:13px}.thumb{width:60px;height:40px;object-fit:cover;border-radius:7px}.hidden{display:none}.login{max-width:400px;margin:80px auto}.note{background:#fff8e7;border:1px solid #f1dfaa;padding:12px;border-radius:10px;color:#725c19;font-size:13px;margin-bottom:14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.table{display:block;overflow:auto}.toolbar{align-items:flex-start;flex-direction:column}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body>
<div class="top"><div class="brand">Deepak<span>Web</span>Studio / Admin</div><div><button id="logout" class="btn hidden" onclick="logout()">Logout</button> <a style="color:white;margin-left:8px" href="index.html">View site ↗</a></div></div>
<div class="wrap">
<div id="login" class="panel login"><h2>Admin Login</h2><div class="note">Sign in with the admin user you created in Supabase Authentication.</div><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:10px" onclick="login()">Login</button></div>
<div id="app" class="hidden">
<div class="grid"><div class="stat"><b id="count">0</b><small>Total demos</small></div><div class="stat"><b id="cats">0</b><small>Categories</small></div><div class="stat"><b id="featured">0</b><small>Featured-ready</small></div><div class="stat"><b>Live</b><small>Showcase status</small></div></div>
<div class="toolbar"><h2>Website Demos</h2><button class="btn primary" onclick="newDemo()">+ Add website</button></div>
<div class="panel"><table class="table"><thead><tr><th>Preview</th><th>Name</th><th>Category</th><th>Live URL</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="toolbar"><h2>Global settings</h2></div>
<div class="panel"><div class="form"><label>WhatsApp number<input id="phone"></label><label>Default WhatsApp message<input id="msg"></label><label>Site logo text<input id="logo"></label><label>Primary theme color<input id="color" type="color"></label></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save settings</button></div></div>
<div id="editor" class="panel hidden" style="margin-top:15px"><h2 id="etitle">Add website</h2><div class="form"><label>Website name<input id="title"></label><label>Category<input id="category"></label><label class="full">Description<textarea id="desc"></textarea></label><label>Thumbnail URL<input id="image"></label><label>Live demo URL<input id="url"></label><label><input id="featuredInput" type="checkbox"> Featured</label><label><input id="activeInput" type="checkbox" checked> Active / visible</label></div><div class="actions"><button class="btn" onclick="closeEditor()">Cancel</button><button class="btn primary" onclick="saveDemo()">Save website</button></div></div>
</div></div>
<script>

const SUPABASE_URL = "https://tuetxbaikmxjbojxlpuf.supabase.co";
const SUPABASE_KEY = "sb_publishable_gLHQx3UqLzDddAKkSbuZyA_0xf8v9yb";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let demos=[], editId=null;

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("pass").value;
  if(!email || !password) return alert("Enter email and password");
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return alert(error.message);
  await show();
}

async function show(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("logout").classList.remove("hidden");
  await loadData();
}

async function loadData(){
  const {data,error}=await sb.from("websites").select("*").order("created_at",{ascending:false});
  if(error) return alert(error.message);
  demos=data||[];
  render();
  await loadSettings();
}

async function render(){
  document.getElementById("count").textContent=demos.length;
  document.getElementById("cats").textContent=new Set(demos.map(x=>x.category)).size;
  document.getElementById("featured").textContent=demos.filter(x=>x.featured).length;
  document.getElementById("rows").innerHTML=demos.map(x=>`<tr>
    <td><img class="thumb" src="${x.image||""}"></td>
    <td><b>${x.title}</b></td>
    <td>${x.category}</td>
    <td>${x.url||"#"}</td>
    <td>
      <button class="btn" onclick="editDemo(${x.id})">Edit</button>
      <button class="btn danger" onclick="delDemo(${x.id})">Delete</button>
    </td>
  </tr>`).join("");
}

function newDemo(){
  editId=null;
  document.getElementById("etitle").textContent="Add website";
  ["title","category","desc","image","url"].forEach(x=>document.getElementById(x).value="");
  document.getElementById("featuredInput").checked=false;
  document.getElementById("activeInput").checked=true;
  document.getElementById("editor").classList.remove("hidden");
}

function editDemo(id){
  const x=demos.find(a=>a.id===id); if(!x) return;
  editId=id;
  document.getElementById("etitle").textContent="Edit website";
  document.getElementById("title").value=x.title||"";
  document.getElementById("category").value=x.category||"";
  document.getElementById("desc").value=x.description||"";
  document.getElementById("image").value=x.image||"";
  document.getElementById("url").value=x.url||"";
  document.getElementById("featuredInput").checked=!!x.featured;
  document.getElementById("activeInput").checked=x.active!==false;
  document.getElementById("editor").classList.remove("hidden");
}

async function saveDemo(){
  const payload={
    title:document.getElementById("title").value.trim(),
    category:document.getElementById("category").value.trim(),
    description:document.getElementById("desc").value.trim(),
    image:document.getElementById("image").value.trim(),
    url:document.getElementById("url").value.trim()||"#",
    featured:document.getElementById("featuredInput").checked,
    active:document.getElementById("activeInput").checked
  };
  if(!payload.title||!payload.category) return alert("Name and category are required");
  let result;
  if(editId) result=await sb.from("websites").update(payload).eq("id",editId);
  else result=await sb.from("websites").insert(payload);
  if(result.error) return alert(result.error.message);
  closeEditor();
  await loadData();
}

async function delDemo(id){
  if(!confirm("Delete this demo permanently?")) return;
  const {error}=await sb.from("websites").delete().eq("id",id);
  if(error) return alert(error.message);
  await loadData();
}

function closeEditor(){document.getElementById("editor").classList.add("hidden");}

async function loadSettings(){
  const {data,error}=await sb.from("site_settings").select("key,value");
  if(error) return alert(error.message);
  const s={}; (data||[]).forEach(x=>s[x.key]=x.value);
  document.getElementById("phone").value=s.phone||"9654885119";
  document.getElementById("msg").value=s.message||"Hi, I'm interested in a website demo. Please share the details.";
  document.getElementById("logo").value=s.logo||"Deepak Web Studio";
  document.getElementById("color").value=s.color||"#6c5ce7";
}

async function saveSettings(){
  const values={
    phone:document.getElementById("phone").value.trim(),
    message:document.getElementById("msg").value.trim(),
    logo:document.getElementById("logo").value.trim(),
    color:document.getElementById("color").value
  };
  for(const [key,value] of Object.entries(values)){
    const {error}=await sb.from("site_settings").upsert({key,value,updated_at:new Date().toISOString()});
    if(error) return alert(error.message);
  }
  alert("Settings saved to Supabase");
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session) await show();
})();

</script>
</body></html>
